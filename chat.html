<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャット画面</title>
    <link rel="stylesheet" href="css/chat.css">
</head>

<body>
    <header class="chat-header">
        <div class="header-info">
            <h1>サッカー＆FPS作戦会議</h1>
            <p class="status">● オンライン</p>
        </div>
        <span class="badge">VC中</span>
    </header>

    <main class="chat-area">
        <div class="date-label">今日</div>

        <div class="message-row other">
            <div class="avatar">NJ</div>
            <div class="message-content">
                <span class="sender-name">ネイマール</span>
                <div class="bubble-wrap">
                    <div class="bubble other-bubble">
                        おつかれ！昨日の試合のスーパーゴール見た？
                    </div>
                    <span class="time">20:41</span>
                </div>
            </div>
        </div>

        <div class="message-row me">
            <div class="bubble-wrap">
                <span class="time">20:42</span>
                <div class="bubble me-bubble">
                    見たよ！あの角度から決めるのはマジでえぐすぎたｗ
                </div>
            </div>
        </div>

        <div class="message-row other">
            <div class="avatar">NJ</div>
            <div class="message-content">
                <span class="sender-name">ネイマール</span>
                <div class="bubble-wrap">
                    <div class="bubble other-bubble">
                        だよな！それよりさ、今日これからVALORANTのランク回さない？新シーズンのアップデート来てからまだ1回も触れてなくて、新しいマップの感じとか早く試したいんだよね。
                    </div>
                    <span class="time">20:43</span>
                </div>
            </div>
        </div>

        <div class="message-row me">
            <div class="bubble-wrap">
                <span class="time">20:44</span>
                <div class="bubble me-bubble">
                    最高！ちょうどPC起動したとこだし21時からいけるよ。
                </div>
            </div>
        </div>

        <div class="message-row other">
            <div class="avatar">NJ</div>
            <div class="message-content">
                <span class="sender-name">ネイマール</span>
                <div class="bubble-wrap">
                    <div class="bubble other-bubble">
                        ナイス！じゃあ21時にDiscord繋ぐわ！
                    </div>
                    <span class="time">20:45</span>
                </div>
            </div>
        </div>

        <div class="message-row me">
            <div class="bubble-wrap">
                <span class="time">20:45</span>
                <div class="bubble me-bubble">
                    了解、ウォームアップして待ってる！
                </div>
            </div>
        </div>
    </main>

    <footer class="input-area">
        <div class="input-box">
            <input type="text" placeholder="メッセージを入力...">
            <button type="button">送信</button>
        </div>
    </footer>
</body>

</html>
